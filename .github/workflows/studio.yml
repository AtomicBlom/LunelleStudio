name: Studio

# The studio builds warning-clean, its tests pass, and the desktop studio is published with its installer
# (build/publish.ps1): on every push and pull request as an artifact to try, and on a v* tag as a GitHub release
# (v0.2.0 publishes 0.2.0).
#
# The engine, the audio, the synth and Vysara come from checkouts beside this one, on their master branches, as
# build/Sources.props finds them. A change here that needs one there passes once that one is merged.
#
# Signing: set the SIGNING_CERTIFICATE (a .pfx, base 64) and SIGNING_CERTIFICATE_PASSWORD secrets. Without them the
# installer is unsigned, and Windows SmartScreen warns of it.
on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # a release, on a tag

jobs:
  studio:
    # Windows: the Windows SDK's DXC signs the DXIL, and Inno Setup is on its image
    runs-on: windows-latest
    env:
      RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # SourceLink wants the history
          lfs: true        # audio (kits, samples) is kept in Git LFS

      # Each with its Git LFS files (Lunelle's library has its sampled kits there): a clone has their pointers until pulled
      - name: Check out the engine, the audio, the synth and Vysara beside the studio
        shell: pwsh
        run: |
          git lfs install
          foreach ($repository in 'Kaldra', 'Sirrow', 'Lunelle', 'Vysara') {
            if (Test-Path "../$repository") { Remove-Item "../$repository" -Recurse -Force }
            git clone --depth 1 --recurse-submodules "https://github.com/AtomicBlom/$repository.git" "../$repository"
            if ($LASTEXITCODE -ne 0) { throw "Cloning $repository failed" }
            git -C "../$repository" lfs pull
            if ($LASTEXITCODE -ne 0) { throw "Pulling $repository's Git LFS files failed" }
          }

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'

      - name: Build
        run: dotnet build BinaryVibrance.LunelleStudio.slnx -c Release -m:1

      - name: Test
        run: dotnet test BinaryVibrance.LunelleStudio.slnx -c Release --no-build

      - name: Choose the version
        shell: pwsh
        run: |
          if ($env:RELEASE -eq 'true') { $version = $env:GITHUB_REF_NAME.Substring(1) }
          else { $version = (dotnet msbuild BinaryVibrance.LunelleStudio.App/BinaryVibrance.LunelleStudio.App.csproj -getProperty:Version).Trim() + ".ci.${{ github.run_number }}" }
          "VERSION=$version" >> $env:GITHUB_ENV

      - name: Publish
        shell: pwsh
        env:
          SIGNING_CERTIFICATE: ${{ secrets.SIGNING_CERTIFICATE }}
          SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.SIGNING_CERTIFICATE_PASSWORD }}
        run: ./build/publish.ps1 -Runtime win-x64 -Version $env:VERSION

      - uses: actions/upload-artifact@v4
        with:
          name: lunelle-studio-win-x64
          path: artifacts/installer/*

      - name: Release
        if: env.RELEASE == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: gh release create $env:GITHUB_REF_NAME (Get-ChildItem artifacts/installer/*) --title "Lunelle Studio $env:VERSION" --generate-notes --prerelease
